name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

jobs:
  starter:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: astral-sh/setup-uv@v10.0.1
      - run: composer install --no-interaction --no-progress
      - run: php vendor/bin/pyhp setup --exact
      - run: php vendor/bin/pyhp info
      - run: php bin/report
      - run: php vendor/bin/pest
